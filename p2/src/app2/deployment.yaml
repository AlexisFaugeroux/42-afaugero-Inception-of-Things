apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-server-app2
  labels:
    app: nginx-server-app2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-server-app2
  template:
    metadata:
      labels:
        app: nginx-server-app2
    spec:
      containers:
      - name: nginx-server
        image: nginx:stable-alpine
        ports:
        - containerPort: 8080
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: nginx.conf
            readOnly: true
          - name: html-file
            mountPath: /usr/share/nginx/html/index.html
            subPath: index.html
            readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config-file
        - name: html-file
          configMap:
            name: html-file 
