apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-server
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
         - path: /
           pathType: Prefix
           backend:
             service:
               name: nginx-server-app3
               port:
                 number: 80
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-server-app1
                port:
                  number: 80

    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-server-app2
                port:
                  number: 80
    - host: app3.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-server-app3
                port:
                  number: 80

