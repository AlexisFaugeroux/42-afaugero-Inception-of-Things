apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-app
  namespace: argocd

spec:
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/jbayonnegit/makesomenoise-gitops-jbayonne
    targetRevision: HEAD # The desired branch -> HEAD reffer to main or master
    path: manifests # Path inside the repository
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
