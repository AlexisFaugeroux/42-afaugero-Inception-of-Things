---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-app
  namespace: argocd
spec:
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  project: default # dedicated app project or overkill ?
  source:
    repoURL: https://github.com/AlexisFaugeroux/42-afaugero-Inception-of-Things
    targetRevision: main
    path: p3/confs/k8s
  syncPolicy:
    automated:
      prune: true # delete k8s resources removed from git
      selfHeal: true # restore modifications manually done in the cluster to the values declared in git
