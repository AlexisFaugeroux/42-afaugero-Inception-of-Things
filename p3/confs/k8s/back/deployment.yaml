---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  labels:
    app: back
spec:
  selector:
    matchLabels:
      app: back
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: back
      labels:
        app: back
    spec:
      containers:
        - name: back
          image: alexisfaugeroux/makesomenoise-back
          imagePullPolicy: IfNotPresent
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: msn-env-secret
                  key: JWT_SECRET
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: msn-env-secret
                  key: POSTGRES_URL
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: msn-env-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: msn-env-config
                  key: POSTGRES_DB
            - name: MEDIA_ROOT
              valueFrom:
                configMapKeyRef:
                  name: msn-env-config
                  key: MEDIA_ROOT
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Startup = migration + archives extraction + seed -> can take a while
          # Liveness and readiness are disabled until the probe succeeds
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            timeoutSeconds: 2
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            timeoutSeconds: 2
            failureThreshold: 3
            periodSeconds: 5
          volumeMounts:
            - name: media-data
              mountPath: /var/www/media
      volumes:
        - name: media-data
          persistentVolumeClaim:
            claimName: media-pvc
