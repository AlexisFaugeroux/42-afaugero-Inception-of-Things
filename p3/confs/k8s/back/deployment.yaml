---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  namespace: dev
  labels:
    app: back
spec:
  selector:
    matchLabels:
      app: back
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: back
      labels:
        app: back
    spec:
      # initContainers:
      # Init containers are exactly like regular containers, except:
      # - Init containers always run to completion.
      # - Each init container must complete successfully before the next one starts.
      containers:
        - name: back
          image: alexisfaugeroux/makesomenoise-back
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: msn-env
                  key: POSTGRES_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: msn-env
                  key: JWT_SECRET
          ports:
            - containerPort: 8080
              name: back
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
            timeoutSeconds: 2
          # Startup = migration + archives extraction + seed -> can take a while
          # Livenes and readiness are disabled until the probe succeeds
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            timeoutSeconds: 2
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            timeoutSeconds: 2
            failureThreshold: 3
            periodSeconds: 5
          volumeMounts:
            - name: media
              mountPath: /var/www/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-data
